<text x="540" y="102" font-size="7.5" fill="#2C2C2A">HiPPO challenges AR/VR.</text>
<text x="540" y="116" font-size="7.5" fill="#5F5E5A">Ana shows evidence.</text>
<text x="540" y="127" font-size="7.5" fill="#5F5E5A">Team aligns on Screen.</text>
<text x="540" y="138" font-size="7.5" fill="#5F5E5A">Decision made in 1 hour.</text>

<!-- ── ROW 2: THOUGHTS / QUOTES ── -->
<line x1="20" y1="148" x2="660" y2="148" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="8" y="172" font-size="7" font-weight="500" fill="#888780" transform="rotate(-90,8,195)">Thoughts</text>

<rect x="24" y="152" width="119" height="52" rx="4" fill="#fff8f8" stroke="#F0997B" stroke-width="0.5"/>
<text x="83" y="166" font-size="7.5" fill="#993C1D" text-anchor="middle" font-style="italic">"Everyone has an opinion.</text>
<text x="83" y="177" font-size="7.5" fill="#993C1D" text-anchor="middle" font-style="italic">Nobody has a framework.</text>
<text x="83" y="188" font-size="7.5" fill="#993C1D" text-anchor="middle" font-style="italic">We're going to ship</text>
<text x="83" y="199" font-size="7.5" fill="#993C1D" text-anchor="middle" font-style="italic">the wrong thing."</text>

<rect x="151" y="152" width="119" height="52" rx="4" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="210" y="166" font-size="7.5" fill="#633806" text-anchor="middle" font-style="italic">"This actually explains</text>
<text x="210" y="177" font-size="7.5" fill="#633806" text-anchor="middle" font-style="italic">the output before I</text>
<text x="210" y="188" font-size="7.5" fill="#633806" text-anchor="middle" font-style="italic">even start. That's</text>
<text x="210" y="199" font-size="7.5" fill="#633806" text-anchor="middle" font-style="italic">different."</text>

<rect x="278" y="152" width="119" height="52" rx="4" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="337" y="166" font-size="7.5" fill="#26215C" text-anchor="middle" font-style="italic">"The values step is</text>
<text x="337" y="177" font-size="7.5" fill="#26215C" text-anchor="middle" font-style="italic">smart — I'd never</text>
<text x="337" y="188" font-size="7.5" fill="#26215C" text-anchor="middle" font-style="italic">thought about ranking</text>
<text x="337" y="199" font-size="7.5" fill="#26215C" text-anchor="middle" font-style="italic">them explicitly."</text>

<rect x="405" y="152" width="119" height="52" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="464" y="166" font-size="7.5" fill="#085041" text-anchor="middle" font-style="italic">"The AR/VR red flags</text>
<text x="464" y="177" font-size="7.5" fill="#085041" text-anchor="middle" font-style="italic">are exactly what I</text>
<text x="464" y="188" font-size="7.5" fill="#085041" text-anchor="middle" font-style="italic">felt but couldn't</text>
<text x="464" y="199" font-size="7.5" fill="#085041" text-anchor="middle" font-style="italic">articulate."</text>

<rect x="532" y="152" width="124" height="52" rx="4" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="594" y="166" font-size="7.5" fill="#085041" text-anchor="middle" font-style="italic">"I walked in with</text>
<text x="594" y="177" font-size="7.5" fill="#085041" text-anchor="middle" font-style="italic">evidence. Nobody</text>
<text x="594" y="188" font-size="7.5" fill="#085041" text-anchor="middle" font-style="italic">could dismiss it</text>
<text x="594" y="199" font-size="7.5" fill="#085041" text-anchor="middle" font-style="italic">with just an opinion."</text>

