<text x="32" y="91" font-size="7.5" fill="#2C2C2A">Team meets to discuss</text>
<text x="32" y="102" font-size="7.5" fill="#2C2C2A">interface strategy</text>
<text x="32" y="116" font-size="7.5" fill="#5F5E5A">HiPPO pushes for AR/VR.</text>
<text x="32" y="127" font-size="7.5" fill="#5F5E5A">Ana has doubts but</text>
<text x="32" y="138" font-size="7.5" fill="#5F5E5A">no evidence to push back.</text>

<!-- Phase 2 actions -->
<rect x="151" y="76" width="119" height="66" rx="4" fill="#f9f9f8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="159" y="91" font-size="7.5" fill="#2C2C2A">Searches for decision</text>
<text x="159" y="102" font-size="7.5" fill="#2C2C2A">frameworks online</text>
<text x="159" y="116" font-size="7.5" fill="#5F5E5A">Finds NEXUS. Reads the</text>
<text x="159" y="127" font-size="7.5" fill="#5F5E5A">minisite. Understands</text>
<text x="159" y="138" font-size="7.5" fill="#5F5E5A">input → output in 2 min.</text>

<!-- Phase 3 actions -->
<rect x="278" y="76" width="119" height="66" rx="4" fill="#f9f9f8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="286" y="91" font-size="7.5" fill="#2C2C2A">Ranks values (Control</text>
<text x="286" y="102" font-size="7.5" fill="#2C2C2A">first). Answers 9 Qs.</text>
<text x="286" y="116" font-size="7.5" fill="#5F5E5A">Completes assessment</text>
<text x="286" y="127" font-size="7.5" fill="#5F5E5A">in 10 minutes.</text>
<text x="286" y="138" font-size="7.5" fill="#5F5E5A">Downloads PDF report.</text>

<!-- Phase 4 actions -->
<rect x="405" y="76" width="119" height="66" rx="4" fill="#f9f9f8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="413" y="91" font-size="7.5" fill="#2C2C2A">Reads recommendation:</text>
<text x="413" y="102" font-size="7.5" fill="#2C2C2A">Screen + AI Vectorial.</text>
<text x="413" y="116" font-size="7.5" fill="#5F5E5A">Reviews red flags for</text>
<text x="413" y="127" font-size="7.5" fill="#5F5E5A">AR/VR. Reads regulatory</text>
<text x="413" y="138" font-size="7.5" fill="#5F5E5A">impact (EU AI Act).</text>

